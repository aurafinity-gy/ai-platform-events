[project]
name = "aurafinity-events-domain"
version = "0.1.0"
description = "Framework-independent Aurafinity Events domain"
requires-python = ">=3.13,<3.14"
dependencies = []
[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.5", "mypy==1.17.0"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -p no:cacheprovider"
[tool.ruff]
line-length = 88
target-version = "py313"
[tool.ruff.lint]
select = ["E","F","I","N","UP","B","SIM","RUF"]
[tool.mypy]
python_version = "3.13"
strict = true
